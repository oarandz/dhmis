<script>
'use strict';
// All content, scoring and styling are embedded. No network requests or dependencies.
// Trait order: warmth, curiosity, sociability, order, imagination, assertiveness, belonging, adventure.
const TRAITS=[['Warmth','Direct & detached','Gentle & supportive'],['Curiosity','Accept & move on','Question & investigate'],['Sociability','Private & reserved','Outgoing & expressive'],['Order','Flexible & spontaneous','Structured & familiar'],['Imagination','Concrete & practical','Dreamy & inventive'],['Assertiveness','Accommodating','Decisive & outspoken'],['Belonging','Independent','Connection-seeking'],['Adventure','Comfort & caution','Novelty & risk']];
const QUESTIONS=[
['THE GROUP TRIP','Your group weekend plans have completely fallen apart. What is your instinct?',[
['Take charge. Someone needs to make a decision.',{3:4,5:4,2:3}],['Suggest something unexpected. This could be the best part.',{7:4,4:4,3:0}],['Check nobody feels upset or left out before deciding.',{0:4,6:4,5:1}],['Make a dry comment, then quietly find a practical solution.',{2:0,4:0,5:2}]]],
['SOMETHING DOESN’T ADD UP','Someone confidently tells you something you are certain is wrong. What do you do?',[
['Ask gentle questions so they can work it out themselves.',{0:4,1:3,5:1}],['Correct them immediately. I cannot let that stand.',{5:4,0:1,1:3}],['Let it go unless it matters. I haven’t got the energy.',{1:0,5:0,2:1}],['Investigate. I may end up in a three-hour rabbit hole.',{1:4,2:1,7:2}]]],
['THE FRIENDSHIP QUESTION','What would secretly bother you most in a friendship?',[
['Feeling replaceable, as if they wouldn’t notice my absence.',{6:4,5:1,0:3}],['Being misunderstood when I am trying to help.',{0:4,6:3,5:2}],['Having my choices controlled or constantly questioned.',{6:0,5:4,7:3}],['Always having to organise everything and keep it going.',{3:4,5:3,4:1}]]],
['A DAY OF YOUR OWN','You have a whole day with no responsibilities. What sounds best?',[
['Make something: write, draw, cook or work on a project.',{4:4,2:1,1:3}],['Favourite food, favourite shows, absolutely no surprises.',{3:4,7:0,2:1}],['Go somewhere unfamiliar and see where the day takes me.',{7:4,3:0,1:3}],['Learn an unreasonable amount about a niche interest.',{1:4,2:0,3:2}]]],
['HELLO, EVERYONE','You enter a room full of people you don’t know. What happens next?',[
['Find one friendly person for a proper conversation.',{2:1,6:4,0:3}],['Get people laughing to break the awkwardness.',{2:4,4:3,5:3}],['Observe until there is a conversation I want to join.',{2:0,1:3,5:1}],['Introduce myself around and help everyone feel included.',{2:4,0:4,6:3}]]],
['HONEST FEEDBACK','A friend shows you something they made. It matters to them, but you don’t think it is very good.',[
['Focus on what I genuinely like. This is personal.',{0:4,5:0,6:3}],['Offer specific, gentle suggestions to improve it.',{0:4,1:3,5:2}],['Be completely honest. I would want the truth.',{0:1,5:4,4:1}],['Ask what they were aiming for. Maybe I have missed it.',{1:4,0:3,4:3}]]],
['UNDER PRESSURE','What are you most like when you are stressed?',[
['I retreat into my own world and need time alone.',{2:0,4:4,5:0}],['I seek reassurance from someone I trust.',{6:4,2:2,5:0}],['I become particular about small things I can control.',{3:4,5:3,7:0}],['I keep busy helping others until my problems catch up.',{0:4,6:3,2:3}]]],
['YOUR LITTLE WEAKNESS','What most often gets you into trouble?',[
['Giving people the benefit of the doubt for too long.',{0:4,5:0,6:3}],['Following my curiosity past the warning signs.',{1:4,7:4,3:0}],['Resisting change when my usual routine isn’t working.',{3:4,7:0,1:1}],['Offering solutions when someone just wants me to listen.',{5:3,4:0,0:2}]]],
['WORDS THAT STICK','Which compliment would mean the most to you?',[
['“I feel safe being completely myself around you.”',{0:4,6:4,5:1}],['“You notice things everyone else misses.”',{1:4,2:1,4:3}],['“You make even an ordinary day entertaining.”',{2:4,4:4,7:3}],['“When you put your mind to it, you make it happen.”',{5:4,3:4,4:1}]]],
['THE NEW DOOR','A mysterious door appears in your home. It definitely wasn’t there yesterday.',[
['Investigate carefully before going through.',{1:4,7:1,3:3}],['Fetch someone I trust. We will deal with it together.',{6:4,0:3,7:1}],['Leave it shut. I was having a perfectly nice evening.',{7:0,3:4,1:0}],['Open it immediately. Opportunities like this are rare.',{7:4,1:4,3:0}]]],
['YOUR VERY OWN LESSON','You must teach a roomful of people something. What is your approach?',[
['Make it playful, colourful and full of surprising ideas.',{4:4,2:4,7:3}],['Give clear steps, useful examples and a proper structure.',{3:4,4:0,5:3}],['Find out what each person needs and encourage them.',{0:4,6:3,5:1}],['Show an intriguing problem and investigate it together.',{1:4,4:3,3:1}]]],
['THE RULE BOOK','Someone says, “That is just how we have always done it.”',[
['Good. A reliable system saves everyone time.',{3:4,7:0,1:1}],['But why? I want to understand the reason.',{1:4,5:2,7:2}],['Then it is time to try something entirely different.',{7:4,3:0,5:4}],['Keep it unless it is making somebody unhappy.',{0:4,3:3,6:3}]]],
['A CREATIVE DIFFERENCE','Your group is making a poster. Everyone has different ideas.',[
['Combine the ideas so everyone gets something in it.',{0:4,6:4,5:1}],['Pick the strongest concept and get everyone behind it.',{5:4,3:3,2:3}],['Let me make something weird. It will be memorable.',{4:4,7:4,3:0}],['I will quietly handle the useful details.',{2:0,3:4,4:0}]]],
['THE EMPTY CHAIR','Your usual seat at a regular gathering is taken. How do you feel?',[
['A little unsettled. I like knowing where I fit.',{3:4,6:4,7:0}],['Fine. It is a chance to talk to somebody new.',{2:4,7:3,3:0}],['I will ask for it back. Everyone knows that is my seat.',{5:4,3:4,0:1}],['Perfect excuse to sit somewhere quiet.',{2:0,6:0,5:1}]]],
['THE MESSAGE','A friend has read your message but hasn’t replied.',[
['They are probably busy. I will get on with my day.',{6:0,0:3,3:2}],['I wonder if I said something wrong.',{6:4,5:0,2:1}],['Send something funny to get the conversation going.',{2:4,4:3,6:3}],['If it is important, ask directly when they can respond.',{5:4,3:3,4:0}]]],
['THE PERFECT LITTLE WORLD','If you could design your own world, what would matter most?',[
['Everybody feels welcome and has somebody to turn to.',{0:4,6:4,2:3}],['There is always another mystery to uncover.',{1:4,7:4,4:3}],['Things work properly and everyone knows the plan.',{3:4,5:4,4:0}],['It is strange, beautiful and entirely my own creation.',{4:4,6:0,7:3}]]],
['A SMALL DISAGREEMENT','Two friends are arguing in front of you.',[
['Listen to both and help them understand each other.',{0:4,6:3,5:2}],['Say plainly who I think is right.',{5:4,0:1,4:0}],['Step away. I need space from the tension.',{2:0,5:0,6:1}],['Break the tension with something silly.',{2:4,4:4,3:0}]]],
['THE STRANGE MACHINE','You have been given a gadget with no instructions.',[
['Take it apart to understand how it works.',{1:4,7:3,4:1}],['Press the interesting-looking button.',{7:4,3:0,4:3}],['Put it away until somebody can explain it safely.',{7:0,3:4,6:2}],['Imagine all the ridiculous things it might do.',{4:4,1:3,2:1}]]],
['A CHANGE OF PLANS','Someone invites you out just as you settle in for the evening.',[
['I am already in my comfortable clothes. Another time.',{7:0,3:4,2:0}],['Yes! The evening just got more interesting.',{2:4,7:4,3:0}],['If they need company, I will make the effort.',{0:4,6:4,2:2}],['Tell me exactly what we are doing before I decide.',{3:4,1:3,5:2}]]],
['YOUR MOMENT','You are unexpectedly asked to speak in front of a crowd.',[
['Give me a minute to gather my thoughts; I will manage.',{2:1,3:3,5:2}],['Great. I have several things I would like to say.',{2:4,5:4,7:3}],['Could somebody stand with me while I do it?',{6:4,5:0,2:1}],['Turn it into a performance with a strange little story.',{4:4,2:4,3:0}]]],
['MISSING PIECES','You notice a tiny detail that contradicts an explanation you accepted.',[
['Follow it. It could change everything.',{1:4,7:3,3:1}],['Mention it once, but avoid derailing the whole plan.',{3:4,5:2,0:3}],['Find somebody who can help me make sense of it.',{1:3,6:4,5:1}],['There is probably a reason. Leave it alone.',{1:0,7:0,3:4}]]],
['A FAVOUR','Someone asks you for a favour when you are already stretched.',[
['Say yes. I hate letting people down.',{0:4,6:4,5:0}],['Say no kindly and suggest another option.',{0:3,5:4,3:3}],['Help if the task sounds interesting.',{1:4,6:1,3:0}],['Offer a smaller favour I can realistically manage.',{0:3,3:4,5:2}]]],
['THE COLLECTION','What are you most likely to keep long after you need it?',[
['Little objects that remind me of people and moments.',{6:4,4:3,3:3}],['Notes about things I want to research or create.',{1:4,4:4,2:1}],['Useful bits that will surely come in handy one day.',{3:4,4:0,7:0}],['Nothing much. I prefer room for whatever comes next.',{7:4,3:0,6:0}]]],
['THE UNEXPECTED YOU','Which side of you do people tend to discover later?',[
['I am much more observant than I first seem.',{1:4,2:0,5:1}],['Under the confident exterior, I care about being liked.',{5:4,6:4,2:3}],['I am more stubborn about my habits than you would think.',{3:4,5:3,7:0}],['My imagination is considerably stranger than advertised.',{4:4,7:3,2:1}]]],
['THE FINAL LESSON','At the end of a very strange day, what would make it worthwhile?',[
['We looked after each other and nobody was left behind.',{0:4,6:4,5:1}],['I discovered something that changed how I see things.',{1:4,7:3,4:3}],['I put everything right and got things back to normal.',{3:4,5:4,7:0}],['I have a brilliant story and an idea for the next adventure.',{4:4,7:4,2:3}]]]
];
// Profiles are editorial interpretations, not official personality measurements.
// Cameos are included as speculative matches, not presented as rich canonical personalities.
const RAW_CAST=[
['Yellow Guy','Main trio',[4,4,1,3,4,0,4,1],'The quiet wonderer','Gentle and inward-looking, with a questioning mind beneath an easily underestimated exterior. Familiar company matters, but a mystery can still draw you in.','Your considerate, curious side is the connection here; this is not a judgment about intelligence.','Established'],
['Red Guy','Main trio',[1,4,0,1,2,3,1,3],'The reluctant realist','You observe the strange machinery around you, question what others accept and value space to think. Your humour can be drier than your surroundings deserve.','His detachment may be stronger than yours.','Established'],
['Duck','Main trio',[1,2,2,4,1,4,2,0],'The creature of habit','You know what you like and are prepared to say it. Familiar routines, a definite role and a healthy supply of opinions keep your world in order.','This match reflects firmness and routine, not every selfish thing he does.','Established'],
['Sketchbook','Web teachers',[1,2,4,3,4,4,2,2],'The creative director','Making things is not enough: you have a vision for how they should turn out. Your expressive side meets a surprisingly strong preference for doing it your way.','Creative control is the overlap; cruelty is not inferred.','Established'],
['Tony the Clock','Web teachers',[0,1,3,4,1,4,1,0],'The keeper of the schedule','Time, structure and clear expectations matter to you. When everyone else drifts, you are the one reminding them that the day is still moving.','A preference for order does not make you threatening.','Established'],
['Shrignold','Web teachers',[2,0,4,4,3,4,4,1],'The devoted recruiter','Shared ideals and belonging are powerful themes in your answers. You like bringing people into a world that makes sense to you.','Belonging is the comparison, not his coercive version of love.','Established'],
['Colin the Computer','Web teachers',[1,4,3,4,1,4,1,1],'The information enthusiast','Questions, systems and details catch your attention. You like being useful through knowledge, though you may be particular about how the conversation proceeds.','Your appetite for information need not include his controlling behaviour.','Established'],
['Steak','Web teachers',[1,1,4,4,1,4,3,0],'The confident instructor','You like a definite explanation and can deliver it with conviction. Guiding the group comes naturally, even when everyone else is distracted.','Confidence and instruction are the match, not the lesson’s logic.','Established'],
['Spinach Can','Web teachers',[1,1,3,4,1,3,3,0],'The persistent chorus','You reinforce the message, keep the group on track and prefer a familiar framework to a free-for-all.','A narrower supporting-role interpretation.','Supporting'],
['Lamp','Web teachers',[0,2,4,0,4,3,1,4],'The chaotic dreamer','Your imagination is vivid and difficult to confine. Ordinary situations become strange little performances, and neat plans rarely survive contact with your ideas.','This is about surreal imagination, not harmful behaviour.','Established'],
['Briefcase','TV teachers',[1,1,4,4,1,4,2,1],'The productivity presenter','You like activity with a purpose, a clear role and a plan that gets people moving. You can turn almost anything into an organised undertaking.','The useful energy is the match, not judging people by employment.','Established'],
['Coffin','TV teachers',[1,1,2,4,0,4,1,0],'The procedural specialist','You prefer clear rules and become frustrated when people will not follow the process. Practical arrangements come before dramatic improvisation.','Rule-following is the overlap.','Established'],
['Lily','TV teachers',[1,1,3,4,2,4,4,0],'The family organiser','Your answers lean towards a defined inner circle, familiar rituals and a strong idea of how the group should work.','This does not endorse the twins’ manipulation.','Established'],
['Todney','TV teachers',[2,1,3,4,2,2,4,0],'The family loyalist','Belonging to a familiar group matters more than chasing novelty. You like shared routines and knowing everyone’s place in the picture.','Lily and Todney have overlapping profiles; their ordering can be close.','Established'],
['Warren the Eagle','TV teachers',[1,1,4,2,3,3,4,1],'The would-be best friend','Being included and making your presence felt are strong themes. You want connection, recognition and the chance to share what matters to you.','This is not a claim that you share his lack of boundaries.','Established'],
['Choo Choo','TV teachers',[2,2,3,1,2,1,2,4],'The wandering guide','You are drawn to movement, new scenery and the possibility of going somewhere else. The journey can matter more than a perfectly organised arrival.','His frailty is not part of the comparison.','Established'],
['Electracey','TV teachers',[3,3,4,2,1,3,2,3],'The helpful enthusiast','You get excited about how things work and want other people to see the possibilities. Useful knowledge and lively encouragement sit side by side.','Her enthusiasm is a better guide here than her dangerous demonstrations.','Established'],
['Lesley','TV supporting',[2,3,1,4,4,4,1,1],'The keeper of the miniature world','Imagination and control meet in this match. You may enjoy watching patterns, arranging details and keeping a private world that others only partly understand.','Her motives are ambiguous; this is an interpretive match.','Supporting'],
['Stain Edwards','TV supporting',[3,2,3,1,4,2,4,3],'The adaptable newcomer','You are open to becoming something new, especially when it helps you find a place among others. Identity and acceptance are central to this reading.','Adaptability is the connection, not the episode’s darker events.','Supporting'],
['Unemployed Brendon','TV supporting',[2,3,0,2,4,2,1,1],'The private creator','You value your own projects and dislike being reduced to somebody else’s label. A quiet creative life can matter more than an impressive public role.','Employment status has nothing to do with this match.','Supporting'],
['Shy Imaginary Older Brother','Brain Friends',[4,2,0,3,3,0,4,0],'The gentle companion','You favour kindness, quiet company and a connection that feels safe. You do not need to dominate the room to make somebody feel less alone.','The match is to his gentle manner, not distressing plot events.','Supporting'],
['Saturdavid','Brain Friends',[3,3,2,2,2,2,3,2],'The practical pal','You are inclined to help, explain and find a workable answer. You can join in the fun without losing track of the simple solution everyone is overlooking.','There is limited screen time, so this interpretation is tentative.','Supporting'],

const CAST=RAW_CAST.map(([name,group,profile,title,description,caveat,evidence])=>({name,group,profile,title,description,caveat,evidence}));
const KEY='dhmis-personality-v1';
let answers=Array(QUESTIONS.length).fill(null),current=0,view='intro',reviewing=false;
const app=document.getElementById('app');
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers,current,view}));}catch(e){/* Private browsing can disable storage. The quiz still works. */}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.answers)&&s.answers.length===25&&s.answers.every(a=>a===null||Number.isInteger(a)&&a>=0&&a<4)){answers=s.answers;current=Number.isInteger(s.current)?Math.min(24,Math.max(0,s.current)):0;}}catch(e){}}
function completed(){return answers.every(a=>a!==null);}
function profileFor(input){return TRAITS.map((_,t)=>{const vals=input.flatMap((a,i)=>a===null?[]:(Object.hasOwn(QUESTIONS[i][2][a][1],t)?[QUESTIONS[i][2][a][1][t]]:[]));return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:2;});}
function questionPoints(character,i,choice){const pairs=Object.entries(QUESTIONS[i][2][choice][1]);return 4-pairs.reduce((sum,[t,value])=>sum+Math.abs(value-character.profile[t]),0)/pairs.length;}
function rank(input){return CAST.map(c=>({...c,score:input.reduce((sum,a,i)=>sum+(a===null?0:questionPoints(c,i,a)),0)})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));}
function scrollTopAndFocus(){window.scrollTo({top:0,behavior:'instant'});const heading=app.querySelector('h1,h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}}
function artwork(){return `<div class="art" aria-hidden="true"><svg viewBox="0 0 300 300"><path d="M38 222 Q36 80 74 67 Q104 57 115 209" fill="#c53732" stroke="#24251f" stroke-width="3"/><path d="M45 223L51 105M58 225L66 92M76 229L78 93M96 222L91 110" stroke="#932b28" stroke-width="5"/><ellipse cx="76" cy="75" rx="14" ry="17" fill="white"/><ellipse cx="102" cy="74" rx="14" ry="17" fill="white"/><circle cx="80" cy="78" r="5"/><circle cx="103" cy="77" r="5"/><path d="M111 236L113 147Q115 110 150 111Q185 112 185 153L190 237" fill="#f5d357" stroke="#24251f" stroke-width="3"/><path d="M122 130Q121 108 132 110L140 101L149 111L160 103L165 118" fill="#4383a7" stroke="#24251f" stroke-width="3"/><ellipse cx="140" cy="150" rx="10" ry="13" fill="white"/><ellipse cx="163" cy="150" rx="10" ry="13" fill="white"/><circle cx="142" cy="152" r="4"/><circle cx="162" cy="152" r="4"/><path d="M140 181Q151 188 163 179" fill="none" stroke="#24251f" stroke-width="3"/><path d="M117 201L132 201L133 225L170 225L172 201L186 201L190 237L113 237" fill="#4383a7"/><path d="M203 238L200 153Q180 98 219 94Q259 91 258 144L267 235" fill="#427358" stroke="#24251f" stroke-width="3"/><ellipse cx="221" cy="116" rx="10" ry="12" fill="white"/><ellipse cx="242" cy="115" rx="10" ry="12" fill="white"/><circle cx="222" cy="117" r="4"/><circle cx="241" cy="117" r="4"/><path d="M209 139L253 134L249 151L216 153Z" fill="#db9b3d" stroke="#24251f" stroke-width="3"/><path d="M203 181L231 192L258 178" fill="none" stroke="#24251f" stroke-width="3"/><path d="M15 239L283 239" stroke="#24251f" stroke-width="3"/><path d="M167 55l7-17 7 17 18 5-18 6-7 17-7-17-18-6Z" fill="#fff7df" stroke="#24251f" stroke-width="2"/></svg><div class="artlabel">EVERYBODY HAS A PLACE.</div></div>`;}
function intro(){view='intro';const done=answers.filter(a=>a!==null).length;app.innerHTML=`<section class="hero"><div><p class="eyebrow">A lesson in being yourself</p><h1>Who are you,<br><em>really?</em></h1><p class="lead">A curious friend? A very particular clock? Or someone much further back in the cupboard?</p><p>Answer 25 peculiar questions to meet your <strong>Don’t Hug Me I’m Scared</strong> counterpart.</p><div class="tags"><span class="tag">25 questions</span><span class="tag">${CAST.length} possible matches</span><span class="tag">About 5 minutes</span></div><div class="actions"><button class="button" id="start">${done?(completed()?'See your result':'Continue · '+done+'/25'):'Let’s find out →'}</button>${done?'<button class="button secondary" id="fresh">Start fresh</button>':''}</div><p class="small" style="margin-top:16px">Pick what feels most like you. There are no correct answers.</p></div>${artwork()}</section><div class="intro-note small"><p>A fan-made quiz across the original web and TV series, including teachers, supporting characters and obscure speaking cameos. Silent appearances and the unaired pilot are outside this edition. Brief cameos have less evidence and more speculative profiles.</p><p>Everything runs on your device. Progress is saved in this browser when available. No sign-in, tracking or external assets.</p>${methodology()}</div>`;document.getElementById('start').onclick=()=>{if(completed())results();else{current=answers.findIndex(a=>a===null);question();}scrollTopAndFocus();};const f=document.getElementById('fresh');if(f)f.onclick=reset;}
function reset(){answers=Array(25).fill(null);current=0;reviewing=false;save();question();scrollTopAndFocus();}
function question(){view='quiz';save();const [topic,text,opts]=QUESTIONS[current];app.innerHTML=`<section class="screen quiz"><div class="progress-label"><span>QUESTION ${String(current+1).padStart(2,'0')} / 25</span><span>${answers.filter(a=>a!==null).length} ANSWERED</span></div><div class="progress" role="progressbar" aria-label="Quiz completion" aria-valuemin="0" aria-valuemax="25" aria-valuenow="${answers.filter(a=>a!==null).length}"><i style="width:${answers.filter(a=>a!==null).length*4}%"></i></div><p class="question-meta">${topic}</p><h2 id="question-title">${escapeHTML(text)}</h2><div class="options" role="group" aria-labelledby="question-title">${opts.map(([label],i)=>`<button class="option" data-choice="${i}" aria-pressed="${answers[current]===i}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHTML(label)}</span></button>`).join('')}</div><div class="quiz-nav"><button class="button secondary" id="back" ${current===0?'disabled':''}>← Back</button><button class="button" id="next" ${answers[current]===null?'disabled':''}>${current===24?'See my result →':'Next question →'}</button></div>${reviewing?'<div class="actions"><button class="button secondary" id="return">Return to results</button></div>':''}<p class="small" style="margin-top:25px">Choose one answer. You can go back and change it.</p></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[current]=Number(b.dataset.choice);save();app.querySelectorAll('[data-choice]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.choice)===answers[current])));document.getElementById('next').disabled=false;const n=answers.filter(a=>a!==null).length;app.querySelector('.progress-label span:last-child').textContent=n+' ANSWERED';app.querySelector('.progress').setAttribute('aria-valuenow',n);app.querySelector('.progress i').style.width=n*4+'%';});document.getElementById('back').onclick=()=>{if(current>0){current--;question();scrollTopAndFocus();}};document.getElementById('next').onclick=()=>{if(answers[current]===null)return;if(current===24){if(completed())results();else{current=answers.findIndex(a=>a===null);question();}}else{current++;question();}scrollTopAndFocus();};const ret=document.getElementById('return');if(ret)ret.onclick=()=>{results();scrollTopAndFocus();};}
function methodology(){return `<details><summary>How the quiz works & character list</summary><p>Each answer expresses three of eight traits on a 0–4 scale. Each character has an editorial profile on the same scales. For each question, points = 4 minus the mean absolute difference between your answer’s three trait values and the character’s values. Adding 25 questions gives a score out of 100. Every question has equal weight; there is no random result or hidden bonus for a main character.</p><p>Match scores are similarities within this quiz, <strong>not probabilities or percentages of your personality</strong>. Several characters can score highly. Ties are ordered alphabetically and are called out in the verdict. Trait bars show your average selected value for that trait, scaled to 100. Lower is not worse.</p><p>Profiles are playful interpretations. “Established”, “Supporting” and “Cameo” describe the amount of character evidence, not mathematical confidence. Cameos are often interpreted from their lesson or group behaviour. The list is broad but does not claim every incidental voice has enough evidence for a distinct personality.</p><p>Character references: <a href="https://donthugme.fandom.com/wiki/Teacher" target="_blank" rel="noopener noreferrer">Teachers</a> · <a href="https://donthugme.fandom.com/wiki/Miscellaneous_Teachers" target="_blank" rel="noopener noreferrer">Web cameos</a> · <a href="https://donthugme.fandom.com/wiki/Brain_Friends" target="_blank" rel="noopener noreferrer">Brain Friends</a> · <a href="https://donthugme.fandom.com/wiki/Don%27t_Hug_Me_I%27m_Scared_(TV_series)" target="_blank" rel="noopener noreferrer">TV cast</a>. Fan-wiki names are used for some unnamed objects. Links are optional; the quiz works offline.</p><div class="roster">${CAST.map(c=>`<div class="castcard"><b>${escapeHTML(c.name)}</b><p>${escapeHTML(c.group)} · ${c.evidence}</p></div>`).join('')}</div></details>`;}
function rankingRows(list,offset=0){return list.map((c,i)=>`<li><div class="rankline"><span class="rankno">${i+1+offset}</span><span class="rankname">${escapeHTML(c.name)}</span><span class="rankscore">${c.score.toFixed(1)}</span></div><div class="bar"><i style="width:${c.score}%;background:${i+offset===0?'var(--red)':'var(--green)'}"></i></div><p class="rankdesc">${escapeHTML(c.title)} · ${c.evidence}${c.evidence==='Cameo'?' · speculative':''}</p></li>`).join('');}
function results(){if(!completed()){current=answers.findIndex(a=>a===null);question();return;}view='result';save();const ranked=rank(answers),winner=ranked[0],second=ranked[1],profile=profileFor(answers),gap=winner.score-second.score;const tied=ranked.filter(c=>Math.abs(c.score-winner.score)<1e-8);const evidence=QUESTIONS.map((q,i)=>({i,p:questionPoints(winner,i,answers[i])})).sort((a,b)=>b.p-a.p||a.i-b.i).slice(0,3);const comparison=TRAITS.map((t,i)=>({i,d:Math.abs(profile[i]-winner.profile[i])})).sort((a,b)=>b.d-a.d)[0];app.innerHTML=`<section class="screen"><div class="result-top"><div><p class="eyebrow">Your lesson is complete</p><p class="question-meta">${tied.length>1?'Joint closest match':gap<2?'A close result':'Your closest match'}</p><h1>${escapeHTML(winner.name)}</h1><p class="lead">${escapeHTML(winner.title)}</p><p>${escapeHTML(winner.description)}</p></div><div class="score-circle"><strong>${winner.score.toFixed(1)}</strong><span>MATCH POINTS / 100</span></div></div><div class="stats"><div class="stat"><b>25 / 25</b><span>QUESTIONS ANSWERED</span></div><div class="stat"><b>${CAST.length}</b><span>CHARACTERS COMPARED</span></div><div class="stat"><b>${gap.toFixed(1)}</b><span>POINTS AHEAD OF SECOND</span></div></div><p class="callout">${tied.length>1?'Joint top scores: '+tied.map(c=>escapeHTML(c.name)).join(', ')+'. Alphabetical order selects the featured result.':gap<2?'A near tie with <strong>'+escapeHTML(second.name)+'</strong>. Your answers sit between the two profiles, so read both as plausible matches.':'Runner-up: <strong>'+escapeHTML(second.name)+'</strong> — '+escapeHTML(second.title)+'.'} ${winner.evidence==='Cameo'?'<strong>This is a speculative cameo result:</strong> the character has very little dialogue.':''}</p><div class="grid"><section class="panel"><h3>Why this character?</h3><p class="small">Three of your strongest-fitting answers:</p><ul class="explanation">${evidence.map(({i})=>`<li><strong>${escapeHTML(QUESTIONS[i][0].toLowerCase())}:</strong> ${escapeHTML(QUESTIONS[i][2][answers[i]][0])}</li>`).join('')}</ul><p>${escapeHTML(winner.caveat)}</p><p class="small"><strong>Where you differ:</strong> your ${TRAITS[comparison.i][0].toLowerCase()} score is ${Math.round(profile[comparison.i]*25)}/100; this character’s profile is ${winner.profile[comparison.i]*25}/100. A closest match does not mean an identical personality.</p></section><section class="panel"><h3>Your personality mix</h3><p class="small">A snapshot of your choices. Neither end is “better”.</p>${TRAITS.map(([name,low,high],i)=>`<div class="trait"><div class="trait-label"><strong>${name}</strong><span>${Math.round(profile[i]*25)}/100</span></div><div class="bar"><i style="width:${profile[i]*25}%"></i></div><div class="trait-label small"><span>${low}</span><span>${high}</span></div></div>`).join('')}</section><section class="panel full"><h3>Your top ten</h3><p class="small">Points out of 100. Similarity scores do not add up to 100. Some displayed scores round to the same value.</p><ol class="ranking">${rankingRows(ranked.slice(0,10))}</ol><details><summary>See all ${CAST.length} character scores</summary><ol class="ranking" start="11">${rankingRows(ranked.slice(10),10)}</ol></details></section><section class="panel full"><h3>Keep your result</h3><p class="small">Copy a short summary or save the full breakdown as a text file.</p><div class="actions"><button class="button" id="copy">Copy result</button><button class="button secondary" id="download">Download results</button><button class="button secondary" id="restart">Take it again</button></div><div id="status" role="status"></div><details><summary>Review or change your answers</summary>${QUESTIONS.map((q,i)=>`<div class="answer-review"><button data-edit="${i}">${i+1}. ${escapeHTML(q[1])}</button><p>${'ABCD'[answers[i]]}. ${escapeHTML(q[2][answers[i]][0])}</p></div>`).join('')}</details>${methodology()}</section></div></section>`;document.getElementById('restart').onclick=()=>{if(window.confirm('Start a fresh quiz? This will clear the answers saved on this device.'))reset();};app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.edit);reviewing=true;question();scrollTopAndFocus();});const summary=`My Don't Hug Me I'm Scared match is ${winner.name}: ${winner.score.toFixed(1)}/100 points.\n${winner.title}\n${winner.description}\nRunner-up: ${second.name} (${second.score.toFixed(1)}/100).\nUnofficial fan quiz — similarity scores, not a scientific personality test.`;document.getElementById('copy').onclick=async()=>{const status=document.getElementById('status');try{await navigator.clipboard.writeText(summary);status.textContent='Result copied.';}catch(e){status.textContent='Clipboard unavailable here. Use Download results to keep your summary.';}};document.getElementById('download').onclick=()=>{const body=summary+'\n\nALL CHARACTER SCORES\n'+ranked.map((c,i)=>`${i+1}. ${c.name}: ${c.score.toFixed(1)}/100 (${c.evidence})`).join('\n')+'\n\nYOUR TRAITS\n'+TRAITS.map((t,i)=>`${t[0]}: ${Math.round(profile[i]*25)}/100 (${t[1]} → ${t[2]})`).join('\n')+'\n\nYOUR ANSWERS\n'+QUESTIONS.map((q,i)=>`${i+1}. ${q[1]}\n${'ABCD'[answers[i]]}. ${q[2][answers[i]][0]}`).join('\n\n');const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='my-dhmis-result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='Your results download is ready.';};}
load();intro();
</script></body></html>
